# ONE-FILE BUILD: this single workflow writes the whole Android app, builds the APK
# and publishes it under the repository's "Releases" page.
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write app source files
        run: |
          set -e
          mkdir -p app/src/main/java/com/kola/autoupload
          cat > settings.gradle.kts <<'KOLA_EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoPhotoUploader"
          include(":app")
          KOLA_EOF_FILE
          cat > build.gradle.kts <<'KOLA_EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KOLA_EOF_FILE
          cat > gradle.properties <<'KOLA_EOF_FILE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          KOLA_EOF_FILE
          cat > app/build.gradle.kts <<'KOLA_EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.kola.autoupload"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.kola.autoupload"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.work:work-runtime-ktx:2.9.1")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          KOLA_EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'KOLA_EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="false"
                  android:label="Auto Photo Uploader"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="androidx.work.impl.foreground.SystemForegroundService"
                      android:foregroundServiceType="dataSync"
                      tools:node="merge" />
              </application>
          </manifest>
          KOLA_EOF_FILE
          cat > app/src/main/java/com/kola/autoupload/Util.kt <<'KOLA_EOF_FILE'
          package com.kola.autoupload

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ContentUris
          import android.content.Context
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import androidx.core.content.ContextCompat
          import androidx.work.Constraints
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.ExistingWorkPolicy
          import androidx.work.ForegroundInfo
          import androidx.work.NetworkType
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean

          data class Item(val id: Long, val uri: Uri, val name: String, val size: Long)

          object Util {
              const val KEY = "6754d0321222e9f58c723a5081ecfc1f"   // your ImgBB API key
              const val MAX = 32L * 1024 * 1024
              private const val CHANNEL = "upload"
              private val lock = Any()
              val running = AtomicBoolean(false)

              fun hasMedia(ctx: Context): Boolean {
                  val p = if (Build.VERSION.SDK_INT >= 33) android.Manifest.permission.READ_MEDIA_IMAGES
                          else android.Manifest.permission.READ_EXTERNAL_STORAGE
                  return ContextCompat.checkSelfPermission(ctx, p) == PackageManager.PERMISSION_GRANTED
              }

              fun wifiOnly(ctx: Context): Boolean =
                  ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getBoolean("wifi", true)

              private fun doneFile(ctx: Context) = File(ctx.filesDir, "done.txt")
              private fun linksFile(ctx: Context) = File(ctx.filesDir, "links.csv")

              fun loadDone(ctx: Context): HashSet<Long> {
                  val s = HashSet<Long>()
                  val f = doneFile(ctx)
                  if (f.exists()) f.forEachLine { l -> l.trim().toLongOrNull()?.let { s.add(it) } }
                  return s
              }

              fun markDone(ctx: Context, id: Long, name: String, url: String?) {
                  synchronized(lock) {
                      doneFile(ctx).appendText("$id\n")
                      if (url != null) linksFile(ctx).appendText("\"" + name.replace("\"", "\"\"") + "\",\"" + url + "\"\n")
                  }
              }

              fun queryAll(ctx: Context): List<Item> {
                  val out = ArrayList<Item>()
                  val base = MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  val proj = arrayOf(
                      MediaStore.Images.Media._ID,
                      MediaStore.Images.Media.DISPLAY_NAME,
                      MediaStore.Images.Media.SIZE
                  )
                  ctx.contentResolver.query(base, proj, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC")?.use { c ->
                      val iId = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                      val iName = c.getColumnIndexOrThrow(MediaStore.Images.Media.DISPLAY_NAME)
                      val iSize = c.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE)
                      while (c.moveToNext()) {
                          val id = c.getLong(iId)
                          out.add(Item(id, ContentUris.withAppendedId(base, id), c.getString(iName) ?: "photo_$id.jpg", c.getLong(iSize)))
                      }
                  }
                  return out
              }

              fun pending(ctx: Context): List<Item> {
                  val done = loadDone(ctx)
                  return queryAll(ctx).filter { it.id !in done }
              }

              /** Uploads one photo. Returns the ImgBB link, or null if it failed. */
              fun upload(ctx: Context, p: Item): String? {
                  for (attempt in 0 until 3) {
                      var c: HttpURLConnection? = null
                      try {
                          val boundary = "----kola" + System.nanoTime()
                          val safeName = p.name.replace("\"", "_").replace("\r", "").replace("\n", "")
                          val head = ("--" + boundary + "\r\nContent-Disposition: form-data; name=\"image\"; filename=\"" + safeName +
                                  "\"\r\nContent-Type: application/octet-stream\r\n\r\n").toByteArray()
                          val tail = ("\r\n--" + boundary + "--\r\n").toByteArray()
                          c = URL("https://api.imgbb.com/1/upload?key=$KEY").openConnection() as HttpURLConnection
                          c.requestMethod = "POST"
                          c.doOutput = true
                          c.connectTimeout = 30000
                          c.readTimeout = 180000
                          c.setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                          c.setFixedLengthStreamingMode(head.size.toLong() + p.size + tail.size.toLong())
                          c.outputStream.use { os ->
                              os.write(head)
                              ctx.contentResolver.openInputStream(p.uri)!!.use { ins -> ins.copyTo(os) }
                              os.write(tail)
                          }
                          val code = c.responseCode
                          if (code == 429) { Thread.sleep(20000); continue }
                          val stream = if (code in 200..299) c.inputStream else c.errorStream
                          val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                          if (code in 200..299) {
                              val j = JSONObject(text)
                              if (j.optBoolean("success")) return j.getJSONObject("data").getString("url")
                          }
                      } catch (e: Exception) {
                          try { Thread.sleep(2000L * (attempt + 1)) } catch (ie: InterruptedException) { return null }
                      } finally {
                          c?.disconnect()
                      }
                  }
                  return null
              }

              fun foreground(ctx: Context, text: String): ForegroundInfo {
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "Photo upload", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(ctx, CHANNEL)
                      .setSmallIcon(android.R.drawable.stat_sys_upload)
                      .setContentTitle("Uploading photos to ImgBB")
                      .setContentText(text)
                      .setOngoing(true)
                      .build()
                  return ForegroundInfo(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
              }

              private fun constraints(ctx: Context): Constraints =
                  Constraints.Builder()
                      .setRequiredNetworkType(if (wifiOnly(ctx)) NetworkType.UNMETERED else NetworkType.CONNECTED)
                      .build()

              /** Start now + keep checking for new photos every 15 minutes (survives app close and reboot). */
              fun schedule(ctx: Context) {
                  val wm = WorkManager.getInstance(ctx)
                  wm.enqueueUniquePeriodicWork(
                      "periodic", ExistingPeriodicWorkPolicy.UPDATE,
                      PeriodicWorkRequestBuilder<UploadWorker>(15, TimeUnit.MINUTES).setConstraints(constraints(ctx)).build()
                  )
                  wm.enqueueUniqueWork(
                      "now", ExistingWorkPolicy.REPLACE,
                      OneTimeWorkRequestBuilder<UploadWorker>().setConstraints(constraints(ctx)).build()
                  )
              }

              /** Called by a finished run that still has photos left, so a big gallery keeps going without waiting. */
              fun chain(ctx: Context) {
                  WorkManager.getInstance(ctx).enqueueUniqueWork(
                      "now", ExistingWorkPolicy.APPEND_OR_REPLACE,
                      OneTimeWorkRequestBuilder<UploadWorker>().setConstraints(constraints(ctx)).build()
                  )
              }
          }
          KOLA_EOF_FILE
          cat > app/src/main/java/com/kola/autoupload/UploadWorker.kt <<'KOLA_EOF_FILE'
          package com.kola.autoupload

          import android.content.Context
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.atomic.AtomicInteger

          class UploadWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {

              override fun doWork(): Result {
                  val ctx = applicationContext
                  if (!Util.hasMedia(ctx)) return Result.success()
                  if (!Util.running.compareAndSet(false, true)) return Result.success()
                  try {
                      val todo = Util.pending(ctx)
                      if (todo.isEmpty()) return Result.success()
                      try { setForegroundAsync(Util.foreground(ctx, "Starting… " + todo.size + " photos")) } catch (e: Exception) {}

                      val queue = ConcurrentLinkedQueue(todo)
                      val ok = AtomicInteger(0)
                      val deadline = System.currentTimeMillis() + 8 * 60 * 1000L   // WorkManager runs get ~10 min; next run continues

                      val threads = (1..3).map {
                          Thread {
                              while (!isStopped && System.currentTimeMillis() < deadline) {
                                  val p = queue.poll() ?: break
                                  if (p.size <= 0 || p.size > Util.MAX) {      // empty or >32MB: ImgBB can't take it, don't retry forever
                                      Util.markDone(ctx, p.id, p.name, null)
                                      continue
                                  }
                                  val url = Util.upload(ctx, p)
                                  if (url != null) {
                                      Util.markDone(ctx, p.id, p.name, url)
                                      val n = ok.incrementAndGet()
                                      if (n % 5 == 0) {
                                          try { setForegroundAsync(Util.foreground(ctx, "Uploaded " + n + " · " + queue.size + " left")) } catch (e: Exception) {}
                                      }
                                  }
                              }
                          }.also { t -> t.start() }
                      }
                      threads.forEach { t -> t.join() }

                      if (ok.get() > 0 && queue.isNotEmpty() && !isStopped) Util.chain(ctx)
                      return Result.success()
                  } finally {
                      Util.running.set(false)
                  }
              }
          }
          KOLA_EOF_FILE
          cat > app/src/main/java/com/kola/autoupload/MainActivity.kt <<'KOLA_EOF_FILE'
          package com.kola.autoupload

          import android.Manifest
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.provider.Settings
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private val handler = Handler(Looper.getMainLooper())
              private val ticker = object : Runnable {
                  override fun run() { refresh(); handler.postDelayed(this, 3000) }
              }

              private fun prefs() = getSharedPreferences("cfg", Context.MODE_PRIVATE)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val pad = (18 * d).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun tv(t: String, size: Float): TextView = TextView(this).apply { text = t; textSize = size }
                  fun btn(t: String, action: () -> Unit): Button = Button(this).apply { text = t; setOnClickListener { action() } }

                  root.addView(tv("☁️ Auto Photo Uploader", 22f))
                  root.addView(tv("Uploads every photo in your gallery to ImgBB by itself — including new photos you take later — even when the app is closed.", 13f).apply { setPadding(0, pad / 2, 0, pad / 2) })
                  status = tv("…", 15f).apply { setPadding(0, pad / 2, 0, pad / 2) }
                  root.addView(status)
                  root.addView(btn("▶ Allow & start auto upload") { start() })
                  root.addView(CheckBox(this).apply {
                      text = "Upload on Wi-Fi only (saves mobile data)"
                      isChecked = prefs().getBoolean("wifi", true)
                      setOnCheckedChangeListener { _, v ->
                          prefs().edit().putBoolean("wifi", v).apply()
                          if (Util.hasMedia(this@MainActivity)) Util.schedule(this@MainActivity)
                      }
                  })
                  root.addView(btn("🔋 Allow background (battery setting)") {
                      try { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) } catch (e: Exception) {}
                  })
                  root.addView(btn("📄 Save all links to Downloads (CSV)") { exportLinks() })
                  root.addView(tv("Tip: when Android asks for photo access, choose “Allow all” — not “Select photos”.", 12f).apply { setPadding(0, pad / 2, 0, 0) })
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onResume() { super.onResume(); handler.post(ticker) }
              override fun onPause() { super.onPause(); handler.removeCallbacks(ticker) }

              private fun start() {
                  val perms = ArrayList<String>()
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add(Manifest.permission.READ_MEDIA_IMAGES)
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  requestPermissions(perms.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (Util.hasMedia(this)) {
                      Util.schedule(this)
                      Toast.makeText(this, "Auto upload started ✔", Toast.LENGTH_LONG).show()
                      refresh()
                  } else {
                      Toast.makeText(this, "Photo permission is needed to upload.", Toast.LENGTH_LONG).show()
                  }
              }

              private fun refresh() {
                  val ctx = applicationContext
                  Thread {
                      val has = Util.hasMedia(ctx)
                      val done = Util.loadDone(ctx).size
                      val left = if (has) Util.pending(ctx).size else -1
                      val msg = if (!has) "Not started yet — tap “Allow & start”."
                                else if (left == 0) "✅ Everything is uploaded ($done photos). New photos will upload automatically."
                                else "☁️ Uploaded: $done\n⏳ Waiting: $left" + (if (Util.running.get()) "\nUploading now…" else "\nNext check within ~15 min (or when Wi-Fi is available).")
                      runOnUiThread { status.text = msg }
                  }.start()
              }

              private fun exportLinks() {
                  val f = File(filesDir, "links.csv")
                  if (!f.exists()) { Toast.makeText(this, "No uploads yet.", Toast.LENGTH_SHORT).show(); return }
                  val v = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, "imgbb_links_" + System.currentTimeMillis() + ".csv")
                      put(MediaStore.Downloads.MIME_TYPE, "text/csv")
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                  if (uri == null) { Toast.makeText(this, "Could not save file.", Toast.LENGTH_SHORT).show(); return }
                  contentResolver.openOutputStream(uri)?.use { o ->
                      o.write("name,url\n".toByteArray())
                      f.inputStream().use { it.copyTo(o) }
                  }
                  Toast.makeText(this, "Saved in Downloads ✔", Toast.LENGTH_LONG).show()
              }
          }
          KOLA_EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPhotoUploader-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Auto Photo Uploader APK (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
